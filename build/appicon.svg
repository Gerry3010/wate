<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2b45"/>
      <stop offset="1" stop-color="#151622"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6c8ff"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#f5c2e7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="round"><rect x="32" y="32" width="448" height="448" rx="108"/></clipPath>
  </defs>

  <!-- rounded window body -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>
  <!-- blurred "wallpaper" glow behind the glass -->
  <g clip-path="url(#round)">
    <ellipse cx="190" cy="170" rx="230" ry="190" fill="url(#glow)" filter="url(#soft)"/>
    <ellipse cx="400" cy="420" rx="170" ry="140" fill="#f5c2e7" fill-opacity="0.10" filter="url(#soft)"/>
    <ellipse cx="120" cy="430" rx="150" ry="120" fill="#94e2d5" fill-opacity="0.08" filter="url(#soft)"/>
  </g>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#glass)"/>
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>

  <!-- split panes: a vertical divider with a snapping tick -->
  <line x1="326" y1="96" x2="326" y2="416" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round"/>
  <line x1="326" y1="240" x2="480" y2="240" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round" clip-path="url(#round)"/>

  <!-- prompt chevron -->
  <path d="M112 156 L226 256 L112 356" fill="none" stroke="url(#accent)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block -->
  <rect x="246" y="300" width="56" height="56" rx="12" fill="#f5e0dc"/>
  <!-- small text lines in the right pane -->
  <rect x="356" y="128" width="72" height="16" rx="8" fill="#a6e3a1" fill-opacity="0.85"/>
  <rect x="356" y="164" width="104" height="16" rx="8" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="356" y="200" width="56" height="16" rx="8" fill="#ffffff" fill-opacity="0.28"/>
  <rect x="356" y="276" width="96" height="16" rx="8" fill="#f9e2af" fill-opacity="0.85"/>
  <rect x="356" y="312" width="64" height="16" rx="8" fill="#ffffff" fill-opacity="0.28"/>
</svg>
